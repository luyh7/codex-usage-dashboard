<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Codex Usage Dashboard</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f5f7f6;
      --panel: #ffffff;
      --line: #d9dfdd;
      --text: #17201d;
      --muted: #65716c;
      --accent: #0f7b63;
      --accent-2: #b85f18;
      --accent-3: #2d5fa8;
      --project-summary: #2d5fa8;
      --danger: #b42318;
      --soft: #edf4f1;
      --shadow: 0 10px 30px rgba(26, 36, 32, 0.08);
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-size: 14px;
    }
    body.data-loading {
      overflow: hidden;
    }
    .loading-overlay[hidden] {
      display: none;
    }
    .loading-overlay {
      position: fixed;
      inset: 0;
      z-index: 60;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(245, 247, 246, 0.82);
      backdrop-filter: blur(2px);
    }
    .loading-indicator {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 48px;
      padding: 10px 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.96);
      box-shadow: var(--shadow);
      color: var(--text);
      font-weight: 650;
    }
    .loading-spinner {
      width: 22px;
      height: 22px;
      flex: 0 0 22px;
      border: 3px solid #c8d5d0;
      border-top-color: var(--accent);
      border-right-color: var(--accent-2);
      border-radius: 50%;
      animation: loading-spin 0.75s linear infinite;
    }
    @keyframes loading-spin {
      to { transform: rotate(360deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      .loading-spinner { animation: none; }
    }
    header {
      position: sticky;
      top: 0;
      z-index: 5;
      background: rgba(245, 247, 246, 0.94);
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(10px);
    }
    .header-inner {
      max-width: 1480px;
      margin: 0 auto;
      padding: 18px 24px 14px;
      display: grid;
      grid-template-columns: minmax(220px, 1fr) auto minmax(220px, 1fr);
      align-items: center;
      gap: 16px;
    }
    .brand {
      min-width: 0;
    }
    h1 {
      margin: 0;
      font-size: 22px;
      line-height: 1.2;
      letter-spacing: 0;
    }
    .subtitle {
      margin-top: 4px;
      color: var(--muted);
      font-size: 13px;
      word-break: break-all;
    }
    .toolbar {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
      justify-self: end;
    }
    .period-wrap {
      position: relative;
      justify-self: center;
    }
    .period-toggle {
      display: grid;
      grid-template-columns: repeat(7, minmax(48px, 1fr));
      gap: 3px;
      min-height: 38px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      min-width: 458px;
    }
    .period-option {
      min-height: 30px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      padding: 0 10px;
      white-space: nowrap;
    }
    .period-option.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 4px rgba(15, 123, 99, 0.22);
    }
    .calendar-popover {
      position: absolute;
      top: calc(100% + 8px);
      left: 50%;
      transform: translateX(-50%);
      width: 360px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 18px 40px rgba(26, 36, 32, 0.18);
      z-index: 20;
    }
    .calendar-popover[hidden] {
      display: none;
    }
    .modal-backdrop[hidden] {
      display: none;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 40;
      display: grid;
      place-items: center;
      padding: 24px;
      background: rgba(23, 32, 29, 0.36);
    }
    .modal {
      width: min(720px, 100%);
      max-height: min(720px, calc(100vh - 48px));
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 20px 60px rgba(23, 32, 29, 0.22);
    }
    .modal-head,
    .modal-actions {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
    }
    .modal-actions {
      justify-content: flex-end;
      border-top: 1px solid var(--line);
      border-bottom: 0;
    }
    .modal-head h2 {
      margin: 0;
      font-size: 16px;
      line-height: 1.3;
    }
    .modal-body {
      padding: 16px;
      display: grid;
      gap: 12px;
    }
    .remote-table {
      width: 100%;
      min-width: 0;
      table-layout: fixed;
      font-size: 13px;
    }
    .remote-table th:nth-child(1) { width: 18%; }
    .remote-table th:nth-child(2) { width: 18%; }
    .remote-table th:nth-child(3) { width: 9%; }
    .remote-table th:nth-child(4) { width: 15%; }
    .remote-table th:nth-child(5) { width: 15%; }
    .remote-table th:nth-child(6) { width: 25%; }
    .remote-table th,
    .remote-table td {
      position: static;
      padding: 8px;
      vertical-align: middle;
    }
    .remote-table th {
      text-align: left;
    }
    .remote-table .remote-count {
      font-variant-numeric: tabular-nums;
      text-align: left;
      white-space: nowrap;
    }
    .remote-table .remote-date,
    .remote-table .remote-code {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .remote-table .remote-action-cell {
      text-align: right;
    }
    .remote-actions {
      display: flex;
      gap: 6px;
      justify-content: flex-end;
      flex-wrap: nowrap;
      white-space: nowrap;
    }
    .remote-actions button {
      min-height: 30px;
      padding: 0 8px;
    }
    .inline-form {
      display: grid;
      gap: 8px;
    }
    .inline-form label {
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }
    .inline-form input {
      width: 100%;
      padding: 0 10px;
    }
    .status-line {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .status-line.error-text {
      color: var(--danger);
    }
    .danger {
      color: var(--danger);
      border-color: #f1b4ae;
      background: #fff7f6;
    }
    .calendar-head,
    .calendar-actions {
      display: grid;
      grid-template-columns: 36px minmax(0, 1fr) 36px;
      gap: 8px;
      align-items: center;
      margin-bottom: 10px;
    }
    .calendar-title {
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 0;
      text-align: center;
      font-weight: 750;
      font-size: 14px;
    }
    .calendar-title-button {
      min-height: 32px;
      padding: 0 4px;
      border: 0;
      background: transparent;
      font: inherit;
    }
    .calendar-title-button:hover {
      background: var(--soft);
    }
    .calendar-title-caret {
      margin-left: 2px;
      color: var(--muted);
      font-size: 10px;
    }
    .calendar-actions {
      grid-template-columns: 1fr 1fr;
      margin: 10px 0 0;
    }
    .calendar-grid {
      display: grid;
      grid-template-columns: repeat(7, minmax(0, 1fr));
      gap: 4px;
    }
    .calendar-picker-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      grid-auto-rows: 64px;
      align-content: center;
      gap: 6px;
      min-height: 295px;
    }
    .calendar-picker-option {
      display: grid;
      grid-template-rows: 18px 15px;
      align-content: center;
      gap: 3px;
      min-width: 0;
      padding: 0 6px;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.1;
    }
    .calendar-picker-option.in-range {
      border-color: #99c9bb;
      background: #eef8f4;
    }
    .calendar-picker-option.selected {
      border-color: var(--accent);
      background: var(--accent);
      color: #fff;
    }
    .calendar-picker-option:disabled {
      color: #b8c0bd;
      cursor: default;
      background: #f8faf9;
    }
    .calendar-picker-usage {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--muted);
      font-size: 10px;
      font-weight: 500;
      line-height: 1.2;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .calendar-picker-option.selected .calendar-picker-usage {
      color: rgba(255, 255, 255, 0.84);
    }
    .calendar-picker-spinner {
      box-sizing: border-box;
      width: 12px;
      height: 12px;
      flex: none;
      border-width: 2px;
      border-color: rgba(99, 116, 109, 0.25);
      border-top-color: currentColor;
    }
    .calendar-picker-option.selected .calendar-picker-spinner {
      border-color: rgba(255, 255, 255, 0.3);
      border-top-color: currentColor;
    }
    .calendar-day-spinner {
      box-sizing: border-box;
      width: 12px;
      height: 12px;
      justify-self: center;
      flex: none;
      border-width: 2px;
      border-color: rgba(99, 116, 109, 0.25);
      border-top-color: currentColor;
    }
    .calendar-day.range-edge .calendar-day-spinner {
      border-color: rgba(255, 255, 255, 0.3);
      border-top-color: currentColor;
    }
    .calendar-day-loading {
      display: grid;
      place-items: center;
    }
    .calendar-weekday {
      color: var(--muted);
      font-size: 11px;
      font-weight: 700;
      text-align: center;
      padding: 4px 0;
    }
    .calendar-day {
      display: grid;
      grid-template-rows: 16px 14px;
      gap: 2px;
      min-height: 42px;
      padding: 4px 2px;
      border-radius: 6px;
      font-size: 12px;
      line-height: 1;
      text-align: center;
    }
    .calendar-day.outside {
      color: #a3aca8;
      background: #fbfcfc;
    }
    .calendar-day.in-range {
      background: #eef8f4;
      border-color: #99c9bb;
    }
    .calendar-day.range-edge {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    .calendar-day:disabled {
      color: #b8c0bd;
      cursor: default;
      background: #f8faf9;
    }
    .calendar-usage {
      color: var(--muted);
      font-size: 10px;
      line-height: 1.2;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .calendar-day.range-edge .calendar-usage {
      color: rgba(255, 255, 255, 0.84);
    }
    .lang-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 3px;
      min-height: 36px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .lang-option {
      min-height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      padding: 0 9px;
    }
    .lang-option.active {
      background: #17201d;
      color: #fff;
    }
    button, select, input {
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
      color: var(--text);
      min-height: 36px;
      font: inherit;
    }
    button {
      padding: 0 12px;
      cursor: pointer;
    }
    button.primary {
      background: var(--accent);
      border-color: var(--accent);
      color: #fff;
    }
    button:hover { border-color: #9da9a4; }
    main {
      max-width: 1480px;
      margin: 0 auto;
      padding: 20px 24px 28px;
    }
    .metrics {
      display: grid;
      grid-template-columns: repeat(6, minmax(130px, 1fr));
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      padding: 14px;
      box-shadow: var(--shadow);
      min-width: 0;
    }
    .metric .label {
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
      white-space: nowrap;
    }
    .metric .value {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.1;
      overflow-wrap: anywhere;
    }
    .metric .hint {
      color: var(--muted);
      font-size: 12px;
      margin-top: 5px;
      min-height: 16px;
      overflow-wrap: anywhere;
    }
    .controls {
      display: grid;
      grid-template-columns: minmax(220px, 1fr) 140px 150px 170px 210px 130px;
      gap: 10px;
      margin-bottom: 16px;
    }
    input, select {
      width: 100%;
      padding: 0 10px;
    }
    .sort-toggle {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 4px;
      min-height: 36px;
      padding: 3px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fff;
    }
    .sort-option {
      min-height: 28px;
      border: 0;
      border-radius: 6px;
      background: transparent;
      color: var(--muted);
      font-weight: 700;
      padding: 0 10px;
    }
    .sort-option.active {
      background: var(--accent);
      color: #fff;
      box-shadow: 0 1px 4px rgba(15, 123, 99, 0.22);
    }
    .layout {
      display: grid;
      grid-template-columns: minmax(0, 1.8fr) minmax(360px, 0.9fr);
      gap: 16px;
      align-items: start;
    }
    section, aside {
      min-width: 0;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }
    .panel-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 14px 10px;
      border-bottom: 1px solid var(--line);
    }
    .panel-title h2 {
      margin: 0;
      font-size: 15px;
      letter-spacing: 0;
    }
    .count {
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .chart {
      padding: 12px 14px 4px;
      border-bottom: 1px solid var(--line);
    }
    .bar-row {
      display: grid;
      grid-template-columns: minmax(100px, 1fr) minmax(120px, 2fr) 90px;
      gap: 10px;
      align-items: center;
      margin-bottom: 8px;
      color: var(--muted);
      font-size: 12px;
    }
    .bar-label {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .bar-track {
      height: 8px;
      border-radius: 6px;
      background: #edf0ef;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--accent);
      min-width: 2px;
    }
    .table-wrap {
      overflow: auto;
      max-height: calc(100vh - 270px);
    }
    table {
      width: 100%;
      border-collapse: collapse;
      table-layout: fixed;
      min-width: 830px;
    }
    th, td {
      border-bottom: 1px solid var(--line);
      padding: 9px 8px;
      text-align: left;
      vertical-align: middle;
    }
    th {
      position: sticky;
      top: 0;
      background: #fbfcfc;
      color: var(--muted);
      z-index: 1;
      font-size: 12px;
      font-weight: 650;
      cursor: pointer;
      white-space: nowrap;
    }
    td {
      font-size: 13px;
    }
    .col-title { width: 238px; }
    .col-total { width: 86px; }
    .col-output { width: 78px; }
    .col-cost { width: 72px; }
    .col-cache { width: 82px; }
    .col-turns { width: 58px; }
    .col-model { width: 112px; }
    .col-effort { width: 76px; }
    th[data-sort="total_tokens"],
    th[data-sort="output_tokens"],
    th[data-sort="estimated_cost_usd"],
    th[data-sort="cached_input_percent"],
    th[data-sort="turn_count"] {
      text-align: right;
    }
    th[data-sort="model"],
    th[data-sort="effort"] {
      overflow: hidden;
      text-overflow: ellipsis;
    }
    tr:hover td { background: #f7faf9; }
    tr.selected td { background: var(--soft); }
    tr.project-group-row td {
      background: #fbfcfc;
      padding: 10px 12px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }
    tr.project-group-row:hover td {
      background: #f4f8f6;
    }
    tr.project-group-row .project-aggregate-cell {
      color: var(--project-summary);
      font-size: 12px;
      font-weight: 700;
    }
    tr.project-group-row .project-total-cell {
      font-weight: 800;
    }
    .project-title-cell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }
    .project-toggle {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      width: 100%;
      min-height: 30px;
      padding: 0;
      border: 0;
      background: transparent;
      text-align: left;
    }
    .project-folder-icon {
      width: 18px;
      height: 18px;
      flex: 0 0 auto;
      color: var(--accent);
    }
    .project-name {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      font-weight: 750;
    }
    .project-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 2px 0 0 30px;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;
    }
    .project-session-row .title-cell {
      padding-left: 34px;
    }
    .project-session-row .title-line {
      gap: 8px;
      margin-bottom: 0;
    }
    .task-root-row .title-line {
      gap: 6px;
    }
    .project-session-row .title-main {
      margin-bottom: 0;
    }
    .project-session-row .title-sub {
      display: none;
    }
    .task-expandable-row .title-cell {
      padding-left: 8px;
    }
    .task-static-row .title-cell {
      padding-left: 32px;
    }
    .project-session-row.task-expandable-row .title-cell {
      padding-left: 34px;
    }
    .project-session-row.task-static-row .title-cell {
      padding-left: 58px;
    }
    .task-child-row .title-cell {
      padding-left: 48px;
    }
    .project-session-row.task-child-row .title-cell {
      padding-left: 74px;
    }
    .task-toggle {
      display: inline-grid;
      place-items: center;
      width: 18px;
      min-width: 18px;
      height: 22px;
      padding: 0;
      border: 0;
      border-radius: 4px;
      background: transparent;
      color: var(--muted);
    }
    .task-toggle:hover {
      background: #e8f1ee;
      color: var(--accent);
    }
    .task-toggle::before {
      content: '';
      width: 6px;
      height: 6px;
      border-right: 2px solid currentColor;
      border-bottom: 2px solid currentColor;
      transform: rotate(-45deg);
      transition: transform 120ms ease;
    }
    .task-toggle[aria-expanded="true"]::before {
      transform: rotate(45deg) translate(-1px, -1px);
    }
    .task-expandable-row td {
      cursor: pointer;
    }
    .project-more-row td {
      background: #fff;
      padding: 8px 8px 10px 34px;
    }
    .project-more-row:hover td {
      background: #fff;
    }
    .project-more-btn {
      min-height: 30px;
      padding: 0 10px;
      color: var(--accent);
      border-color: #99c9bb;
      background: #eef8f4;
      font-weight: 700;
    }
    .rank {
      color: var(--muted);
      white-space: nowrap;
      text-align: center;
      padding-left: 4px;
      padding-right: 4px;
    }
    .title-cell {
      min-width: 0;
    }
    .title-line {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
    }
    .title-main {
      font-weight: 650;
      margin-bottom: 4px;
      line-height: 1.35;
      min-width: 0;
      flex: 1 1 auto;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title-time {
      flex: 0 0 auto;
      color: var(--muted);
      font-size: 12px;
      font-weight: 650;
      white-space: nowrap;
    }
    .title-sub {
      color: var(--muted);
      font-size: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .title-sub-text {
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .number {
      font-variant-numeric: tabular-nums;
      text-align: right;
      white-space: nowrap;
    }
    .model-cell,
    .effort-cell {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      flex: 0 0 auto;
      min-height: 22px;
      padding: 2px 7px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #fff;
      color: var(--muted);
      font-size: 12px;
      white-space: nowrap;

    .badge.archived { color: var(--accent-2); border-color: #e3b887; background: #fff6ec; }
    .badge.env { color: var(--accent-3); border-color: #a9c0df; background: #eef4fb; }
    .badge.env.wsl { color: var(--accent); border-color: #99c9bb; background: #eef8f4; }
    .badge.env.windows { color: var(--accent-3); border-color: #a9c0df; background: #eef4fb; }
    .badge.env.remote { color: #7a4c12; border-color: #e3c27a; background: #fff8e5; }

      min-width: 24px;
      min-height: 22px;

      padding: 2px;
      color: #5b4aa0;
      border-color: #c3b8ee;
      background: #f4f1ff;

      width: 13px;
      height: 13px;
      flex: 0 0 auto;
    }
    .remote-mark {
      margin-right: 4px;
      font-weight: 800;
      line-height: 1;
    }
    .details {
      position: sticky;
      top: 94px;
      max-height: calc(100vh - 112px);
      overflow: auto;
    }
    .details-body {
      padding: 14px;
    }
    .empty {
      color: var(--muted);
      padding: 22px 14px;
      text-align: center;
    }
    .detail-title {
      font-size: 17px;
      font-weight: 750;
      line-height: 1.35;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }
    .detail-badges {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }
    .detail-meta {
      display: grid;
      gap: 8px;
      margin: 12px 0;
    }
    .kv {
      display: grid;
      grid-template-columns: 110px minmax(0, 1fr);
      gap: 10px;
      color: var(--muted);
      font-size: 12px;
    }
    .kv strong {
      color: var(--text);
      font-weight: 550;
      overflow-wrap: anywhere;
    }
    .breakdown {
      display: grid;
      gap: 8px;
      margin: 14px 0;
    }
    .breakdown-row {
      display: grid;
      grid-template-columns: 92px minmax(100px, 1fr) 148px;
      gap: 8px;
      align-items: center;
      font-size: 12px;
      color: var(--muted);
    }
    .breakdown-value {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      white-space: nowrap;
    }
    .breakdown-value strong {
      color: var(--text);
      font-weight: 650;
    }
    .price-tooltip-trigger {
      cursor: help;
      text-decoration-line: underline;
      text-decoration-style: dotted;
      text-underline-offset: 3px;
    }
    .price-tooltip-trigger:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 2px;
      border-radius: 2px;
    }
    .breakdown-row .bar-fill.input { background: var(--accent-3); }
    .breakdown-row .bar-fill.cached { background: var(--accent); }
    .breakdown-row .bar-fill.cache-write { background: #b64b72; }
    .breakdown-row .bar-fill.output { background: var(--accent-2); }
    .breakdown-row .bar-fill.reasoning { background: #6f6a25; }
    canvas {
      width: 100%;
      height: 150px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfcfc;
      display: block;
    }
    .section-label {
      margin: 16px 0 8px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
    }
    .mini-table {
      min-width: 0;
      font-size: 12px;
    }
    .event-pagination { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-top:8px; }
    #sessionRows tr:focus-visible { outline:2px solid #0f7b63; outline-offset:-2px; }
    .timeline-table {
      min-width: 680px;
    }
    .mini-table th, .mini-table td {
      padding: 7px 8px;
    }
    .mini-table th {
      position: static;
      cursor: default;
    }
    .path {
      font-family: ui-monospace, SFMono-Regular, Consolas, "Liberation Mono", monospace;
      font-size: 12px;
      overflow-wrap: anywhere;
    }
    .notice {
      margin-top: 10px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }
    .task-detail-summary {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 8px 14px;
      align-items: center;
      margin: 14px 0;
      padding: 10px 12px;
      border: 1px solid #99c9bb;
      border-radius: 6px;
      background: #eef8f4;
    }
    .task-detail-summary-label {
      color: var(--accent);
      font-size: 12px;
      font-weight: 750;
    }
    .task-detail-summary-value {
      color: var(--text);
      font-size: 15px;
      font-variant-numeric: tabular-nums;
      font-weight: 750;
      white-space: nowrap;
    }
    .task-detail-summary-meta {
      grid-column: 1 / -1;
      color: var(--muted);
      font-size: 12px;
    }
    .error {
      color: var(--danger);
      padding: 14px;
    }
    @media (max-width: 1100px) {
      .header-inner { grid-template-columns: 1fr; align-items: flex-start; }
      .period-wrap { justify-self: start; width: 100%; max-width: 620px; }
      .period-toggle { width: 100%; min-width: 0; }
      .toolbar { justify-self: start; justify-content: flex-start; }
      .metrics { grid-template-columns: repeat(3, minmax(130px, 1fr)); }
      .controls { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .layout { grid-template-columns: 1fr; }
      .details { position: static; max-height: none; }
      .table-wrap { max-height: none; }
    }
    @media (max-width: 760px) {
      .header-inner { grid-template-columns: 1fr; padding: 16px; }
      main { padding: 16px; }
      .toolbar { justify-content: flex-start; }
      .period-toggle { grid-template-columns: repeat(7, minmax(0, 1fr)); }
      .period-option { padding: 0 6px; }
      .calendar-popover { left: 0; transform: none; width: min(358px, calc(100vw - 32px)); }
      .metrics { grid-template-columns: repeat(2, minmax(120px, 1fr)); }
      .controls { grid-template-columns: 1fr; }
      .project-title-cell { grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
      .project-meta { flex-wrap: wrap; }
      .project-session-row .title-cell { padding-left: 34px; }
      .bar-row { grid-template-columns: 1fr; gap: 4px; }
      .breakdown-row { grid-template-columns: 64px minmax(0, 1fr) minmax(112px, auto); gap: 6px; }
      .breakdown-value { gap: 5px; }
      .kv { grid-template-columns: 1fr; gap: 2px; }
    }
    .snapshot-export-progress { flex-basis: 100%; max-width: 320px; margin: 4px 0 0 auto; }
    .snapshot-export-progress[hidden] { display: none; }
    .snapshot-export-caption { display: flex; justify-content: space-between; margin-bottom: 7px; font-size: 12px; color: var(--muted); }
    .snapshot-export-caption strong { font-variant-numeric: tabular-nums; }
    .snapshot-export-track { height: 6px; overflow: hidden; border-radius: 6px; background: #8899aa24; }
    .snapshot-export-track span { display: block; height: 100%; width: 0; border-radius: inherit; background: var(--accent, #34b89b); transition: width 180ms ease-out; }
    #snapshotExportBtn[aria-busy=true]::before { content: ''; display: inline-block; width: 12px; height: 12px; margin-right: 7px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; vertical-align: -2px; animation: snapshot-export-spin .8s linear infinite; }
    @keyframes snapshot-export-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #snapshotExportBtn[aria-busy=true]::before { animation: none; } .snapshot-export-track span { transition: none; } }

  <div class="loading-overlay" id="loadingOverlay" role="status" aria-live="polite" aria-atomic="true">

      </div>
      <div class="period-wrap" id="periodWrap">

          <button class="period-option" data-period-button="7d" data-i18n="period7d" type="button">7日</button>
          <button class="period-option" data-period-button="30d" data-i18n="period30d" type="button">30日</button>

          <button class="period-option" id="calendarBtn" data-i18n="calendarButton" type="button">日期</button>
        </div>
        <div class="calendar-popover" id="calendarPopover" hidden></div>
      </div>
      <div class="toolbar">
        <div class="lang-toggle" aria-label="语言" data-i18n-aria="language">
          <button class="lang-option active" data-lang-button="zh" type="button">中文</button>
          <button class="lang-option" data-lang-button="en" type="button">EN</button>

        <button id="refreshBtn" class="primary" title="重新扫描本地日志" data-i18n="refresh" data-i18n-title="refreshTitle">刷新</button>
        <button id="remoteBtn" title="导入远程数据" data-i18n="importRemote" data-i18n-title="importRemoteTitle">导入远程数据</button>

        </div>

    function t(key, vars = {}) {
      const template = (I18N[state.lang] && I18N[state.lang][key]) || I18N.zh[key] || key;
      return template.replace(/\{(\w+)\}/g, (_, name) => String(vars[name] ?? ''));
    }

    function locale() {
      return state.lang === 'en' ? 'en-US' : 'zh-CN';
    }

    function applyStaticText() {
      document.documentElement.lang = state.lang === 'en' ? 'en' : 'zh-CN';
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.dataset.i18n);
      });
      document.querySelectorAll('[data-i18n-title]').forEach(el => {
        el.title = t(el.dataset.i18nTitle);
      });
      document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
        el.placeholder = t(el.dataset.i18nPlaceholder);
      });
      document.querySelectorAll('[data-i18n-aria]').forEach(el => {
        el.setAttribute('aria-label', t(el.dataset.i18nAria));
      });
      document.querySelectorAll('[data-lang-button]').forEach(button => {
        button.classList.toggle('active', button.dataset.langButton === state.lang);
      });
      updateRemoteButton();
      updatePeriodButtons();
      if (state.generatedAt) {
        document.getElementById('codexHome').textContent = `${state.codexHome || ''} · ${fmtDate(state.generatedAt)} ${t('scanned')}`;
      }
    }

    function environmentsFromSessions() {
      const seen = new Map();
      state.sessions.forEach(row => {
        const id = row.environment_id || row.environment || 'local';
        if (!seen.has(id)) seen.set(id, { id, label: row.environment || id });
      });
      return Array.from(seen.values());
    }

    function populateEnvironmentFilter() {
      const select = document.getElementById('environmentFilter');
      const oldValue = select.value || state.environment;
      const sources = state.codexSources.length ? state.codexSources : environmentsFromSessions();
      select.innerHTML = `<option value="all">${escapeHtml(t('environmentAll'))}</option>` + sources
        .map(source => `<option value="${escapeHtml(source.id)}">${escapeHtml(source.label)}</option>`)
        .join('');
      const values = sources.map(source => source.id);
      select.value = values.includes(oldValue) ? oldValue : 'all';
      state.environment = select.value;
    }

    function populateSourceFilter() {
      const select = document.getElementById('sourceFilter');
      const oldValue = select.value || state.source;
      select.innerHTML = [
        ['all', t('sourceAll')],
        ['active', t('sourceActive')],
        ['archived', t('sourceArchived')],
      ].map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`).join('');
      select.value = ['all', 'active', 'archived'].includes(oldValue) ? oldValue : 'all';
      state.source = select.value;
    }

    function populateLimitSelect() {
      const select = document.getElementById('limitSelect');
      const oldValue = select.value || state.limit;
      select.innerHTML = [
        ['50', t('limit50')],
        ['100', t('limit100')],
        ['all', t('limitAll')],
      ].map(([value, label]) => `<option value="${value}">${escapeHtml(label)}</option>`).join('');
      select.value = ['50', '100', 'all'].includes(oldValue) ? oldValue : '50';
      state.limit = select.value;
    }

      state.lang = lang === 'en' ? 'en' : 'zh';
      applyStaticText();
      populateEnvironmentFilter();
      populateSourceFilter();

    function usageOf(row) {
      return row && row.total_token_usage ? row.total_token_usage : {};
    }

    function tokenValue(row, key) {
      return Number(usageOf(row)[key] || 0);
    }

    function zeroClientUsage() {
      return Object.fromEntries(tokenKeys.map(key => [key, 0]));
    }

    function addClientUsage(left, right) {
      const usage = {};
      tokenKeys.forEach(key => {
        usage[key] = Number(left?.[key] || 0) + Number(right?.[key] || 0);
      });
      return usage;
    }

    function fmtPercent(value) {
      if (value === null || value === undefined || value === '') return 'N/A';
      const number = Number(value);
      if (!Number.isFinite(number)) return 'N/A';
      return number.toFixed(1) + '%';
    }

    function fmtUsd(value) {
      if (value === null || value === undefined || value === '') return 'N/A';
      const number = Number(value);
      if (!Number.isFinite(number)) return 'N/A';
      if (number > 0 && number < 0.01) return '$' + number.toFixed(4);
      return '$' + number.toFixed(2);
    }

    function fmtUsdRate(value) {
      const number = Number(value);
      if (!Number.isFinite(number)) return 'N/A';
      if (Math.abs(number - Number(number.toFixed(2))) < 1e-9) return '$' + number.toFixed(2);
      if (Math.abs(number - Number(number.toFixed(3))) < 1e-9) return '$' + number.toFixed(3);
      return '$' + number.toFixed(4);
    }

    function fmt(n) {
      return Number(n || 0).toLocaleString(locale());
    }

    function fmtCompact(n) {
      const value = Number(n || 0);
      if (value >= 1000000000) return (value / 1000000000).toFixed(2) + 'B';
      if (value >= 1000000) return (value / 1000000).toFixed(2) + 'M';
      if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
      return String(value);
    }

    function fmtCalendarTokens(n) {
      const value = Number(n || 0);
      if (value >= 1000000000) {
        const compact = value / 1000000000;
        return (compact > 10 ? Math.round(compact) : compact.toFixed(2)) + 'B';
      }
      if (value >= 1000000) {
        const compact = value / 1000000;
        return (compact > 10 ? Math.round(compact) : compact.toFixed(2)) + 'M';
      }
      if (value >= 1000) {
        const compact = value / 1000;
        return (compact > 10 ? Math.round(compact) : compact.toFixed(1)) + 'K';
      }
      return String(value);
    }

    function fmtDate(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return String(value);
      return date.toLocaleString(locale(), { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' });
    }

    function fmtRelativeTime(value) {
      if (!value) return '';
      const date = new Date(value);
      if (Number.isNaN(date.getTime())) return '';
      const diffSeconds = Math.max(0, Math.floor((Date.now() - date.getTime()) / 1000));
      if (diffSeconds < 60) return t('justNow');
      const minutes = Math.floor(diffSeconds / 60);
      if (minutes < 60) return t('minutes', { value: minutes });
      const hours = Math.floor(minutes / 60);
      if (hours < 48) return t('hours', { value: hours });
      const days = Math.floor(hours / 24);
      if (days < 30) return t('days', { value: days });
      const months = Math.floor(days / 30);
      if (months < 12) return t('months', { value: months });
      return t('years', { value: Math.floor(months / 12) });
    }

    function fmtDuration(ms) {
      if (!ms) return '';
      const seconds = Math.round(ms / 1000);
      if (seconds < 60) return t('seconds', { value: seconds });
      const minutes = Math.floor(seconds / 60);
      const rest = seconds % 60;
      if (minutes < 60) return t('minutesSeconds', { minutes, seconds: rest });
      const hours = Math.floor(minutes / 60);
      return t('hoursMinutes', { hours, minutes: minutes % 60 });
    }

    function escapeHtml(value) {
      return String(value ?? '')
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;');
    }

    function shortPath(path) {
      if (!path) return '';
      const parts = String(path).split(/[\\/]+/).filter(Boolean);
      return parts.slice(-3).join(' / ');
    }

    function rowTime(row) {
      const date = new Date(row.last_usage_at || 0);
      const value = date.getTime();
      return Number.isFinite(value) ? value : 0;
    }

    function projectName(row) {
      return row.project || shortPath(row.cwd) || row.session_id || t('projectTab');
    }

    function workspaceKey(row) {
      return row.project_root || row.cwd || row.project || row.path || row.session_id || 'unknown';
    }

    function projectKey(row) {
      const environment = row.environment_id || row.environment || 'local';
      return `${encodeURIComponent(environment)}::${encodeURIComponent(workspaceKey(row))}`;
    }

    function badgeClass(value) {
      return String(value || 'local').toLowerCase().replace(/[^a-z0-9_-]+/g, '-');
    }

    function environmentBadge(row) {
      const label = row.environment || '';
      if (!label) return '';
      const remote = row.is_remote ? `<span class="remote-mark" title="${escapeHtml(t('remoteDevicePrefix'))}">↗</span>` : '';
      return `<span class="badge env ${row.is_remote ? 'remote' : ''} ${escapeHtml(badgeClass(row.environment_id || label))}">${remote}${escapeHtml(label)}</span>`;
    }

      const title = row.workspace_root || row.cwd
        ? `${label} · ${row.workspace_root || row.cwd}`
