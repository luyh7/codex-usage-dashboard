name: Client CI
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
permissions:
  contents: read
jobs:
  changes:
    name: Plan validation
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      rebuild: ${{ steps.changes.outputs.rebuild }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - id: changes
        run: node tools/ci-changes.mjs
  validate:
    name: Validate clients
    needs: changes
    if: needs.changes.outputs.rebuild == 'true'
    # A docs-only push skips this job and leaves earlier code validation alive.
    # A code push replaces the complete old validation, including both matrices.
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    uses: ./.github/workflows/validate.yml
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate
          path: dist/publish
      - name: Verify tag belongs to main
        run: |
          node tools/check_release.mjs "$RELEASE_TAG"
          git fetch origin main
          git merge-base --is-ancestor HEAD origin/main
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - run: gh release create "$RELEASE_TAG" dist/publish/* --verify-tag --notes-file "docs/releases/$RELEASE_TAG.md" --title "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          GH_TOKEN: ${{ github.token }}
  verify-published:
    name: Published download (${{ matrix.platform }})
    needs: publish
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            platform: linux-x64
          - os: windows-2022
            platform: windows-x64
          - os: macos-15-intel
            platform: darwin-x64
          - os: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/verify_published.mjs
        env:
          RELEASE_TAG: ${{ github.ref_name }}
      - uses: actions/upload-artifact@v4
        with:
          name: published-${{ matrix.platform }}
          path: output/published-${{ matrix.platform }}.json
          if-no-files-found: error
