[package]
name = "usage-server"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[[bin]]
name = "codex-usage-dashboard"
path = "src/main.rs"

[dependencies]
usage-runtime = { path = "../usage-runtime" }
usage-core = { path = "../usage-core" }
serde.workspace = true
serde_json.workspace = true
chrono.workspace = true
regex.workspace = true
chrono-tz = "0.10"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "process", "signal", "sync", "time", "macros"] }
tokio-stream = { version = "0.1", features = ["sync"] }
notify = "8"
clap = { version = "4", features = ["derive"] }
sha2 = "0.10"
hmac = "0.12"
getrandom = "0.4"
fs2 = "0.4"
tempfile = "3"
iana-time-zone = "0.1"
flate2 = "1"

[build-dependencies]
sha2 = "0.10"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11.1", default-features = false, features = ["tokio"] }

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.16.1", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console", "Win32_System_Threading"] }
