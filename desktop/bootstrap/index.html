<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Codex Usage Dashboard</title>
<style>body{margin:0;background:#f5f8f7;color:#193b34;font:16px system-ui;display:grid;min-height:100vh;place-items:center}main{max-width:600px;padding:40px}h1{font-size:24px}p{white-space:pre-wrap;overflow-wrap:anywhere;color:#526b63}button{background:#d4f4e7;border:1px solid #87cdb1;border-radius:8px;padding:10px 20px;color:inherit;cursor:pointer}button:hover{background:#b7ead5}button:active{background:#9adbbf}button:focus-visible{outline:3px solid #328568}button:disabled{opacity:.5;cursor:wait}</style>
<main><h1>Codex Usage Dashboard</h1><p id="message" role="status">Starting…</p><button id="retry" hidden>Retry</button></main>
<script>const chinese=navigator.language.startsWith('zh');document.documentElement.lang=chinese?'zh-CN':'en';const loading=chinese?'正在启动…':'Starting…';const button=document.getElementById('retry');button.textContent=chinese?'重试':'Retry';document.getElementById('message').textContent=loading;button.onclick=async()=>{button.disabled=true;document.getElementById('message').textContent=loading;try{await window.__TAURI__.core.invoke('retry_service')}catch(e){showError(String(e))}};function showError(message){document.getElementById('message').textContent=message;button.hidden=false;button.disabled=false}</script></html>
